<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Formulario - Nombre y Edad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Formulario</h1>
    <form id="person-form" novalidate>
      <div class="field">
        <label for="name">Nombre ok</label>
        <input type="text" id="name" name="name" required minlength="2" placeholder="Tu nombre">
        <small class="error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="age">Edad</label>
        <input type="number" id="age" name="age" required min="0" max="150" placeholder="Tu edad">
        <small class="error" aria-live="polite"></small>
      </div>

        <div class="field">
          <label for="phone">Teléfono</label>
          <input type="tel" id="phone" name="phone" required placeholder="Ej: +593987654321" pattern="[0-9+\-\s()]{6,20}">
          <small class="error" aria-live="polite"></small>
        </div>

        <div class="field">
          <label for="address">Dirección</label>
          <textarea id="address" name="address" rows="3" required minlength="5" placeholder="Calle, número, ciudad"></textarea>
          <small class="error" aria-live="polite"></small>
        </div>

      <div class="actions">
        <button type="submit">Enviar</button>
        <button type="button" id="reset-btn">Limpiar</button>
      </div>
    </form>

    <section id="result" class="result" aria-live="polite" hidden>
      <h2>Datos recibidos</h2>
      <p><strong>Nombre:</strong> <span id="res-name"></span></p>
      <p><strong>Edad:</strong> <span id="res-age"></span></p>
      <p><strong>Teléfono:</strong> <span id="res-phone"></span></p>
  <p><strong>Dirección:</strong> <span id="res-address"></span></p>
      <button id="close-result">Cerrar</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
